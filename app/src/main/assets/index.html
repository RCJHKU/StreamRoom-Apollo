<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stream Room</title>
<style>
:root{--bg:#090b10;--rail:rgba(11,14,22,.96);--card:#141824;--accent:#00a8e8;--gold:#f5c518;--text:#fff;--muted:#8b95a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,sans-serif;overflow:hidden;user-select:none}
button:focus,input:focus{outline:2.5px solid var(--accent);box-shadow:0 0 18px rgba(0,168,232,.55);transform:scale(1.03);z-index:20}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#132238,#07090d 75%);z-index:600}
.lbox{background:rgba(15,19,29,.95);padding:36px;border-radius:16px;width:430px;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 60px rgba(0,0,0,.8)}
.brand{font-size:28px;font-weight:900;letter-spacing:1.5px;margin-bottom:4px}.brand span{color:var(--accent)}
input{width:100%;padding:13px 14px;margin-bottom:11px;background:#080a0f;border:1px solid #262e40;border-radius:8px;color:#fff;font-size:15px}
.btn{width:100%;padding:12px 22px;background:var(--accent);color:#031018;border:0;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px;transition:.15s}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px)}
#shell{display:none;height:100vh;width:100vw}
.rail{width:74px;background:var(--rail);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;justify-content:space-between;padding:18px 9px;transition:width .2s;z-index:80}
.rail.open{width:215px}
.rbtn{display:flex;align-items:center;gap:14px;background:0;border:0;color:var(--muted);padding:12px;border-radius:10px;font-size:15px;cursor:pointer;width:100%;text-align:left;margin-bottom:4px;white-space:nowrap}
.rbtn.act{background:rgba(0,168,232,.18);color:#fff;font-weight:700;border-left:3px solid var(--accent)}
.rlbl{display:none}.rail.open .rlbl{display:inline}
.stage{flex:1;height:100vh;overflow-y:auto;position:relative;scroll-behavior:smooth}
.topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 40px;background:linear-gradient(180deg,rgba(9,11,16,.95),rgba(9,11,16,0))}
.pills{display:flex;gap:8px}.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:#cbd5e1;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}
.pill.act{background:var(--accent);color:#000;font-weight:800}
.hero{position:relative;height:58vh;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:34px 40px;background-size:cover;background-position:center;margin-top:-54px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#090b10 18%,rgba(9,11,16,.45) 60%,rgba(9,11,16,.1)),linear-gradient(0deg,#090b10 6%,transparent 55%)}
.hcontent{position:relative;z-index:2;max-width:600px}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin:8px 0 12px;color:#cbd5e1}
.imdb{background:var(--gold);color:#000;padding:2px 6px;border-radius:4px;font-weight:900;font-size:11px}
.hd{border:1px solid rgba(255,255,255,.35);padding:1px 6px;border-radius:4px;font-size:11px}
.section{padding:10px 40px 18px}
.stitle{font-size:17px;font-weight:700;margin-bottom:10px;letter-spacing:.3px}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 12px}
.row::-webkit-scrollbar{height:0}
.poster{flex:0 0 155px;background:var(--card);border:0;border-radius:10px;overflow:hidden;color:#fff;text-align:left;cursor:pointer;position:relative}
.pimg{width:100%;height:220px;object-fit:cover;display:block;background:linear-gradient(145deg,#172033,#0d111a)}
.pbadge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);color:var(--gold);font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px}
.ptitle{padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-wrap{position:relative;height:100vh;width:100%;background:#000;overflow:hidden}
#pvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.epg-overlay{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(9,11,16,.94) 0%,rgba(9,11,16,.78) 46%,rgba(9,11,16,.15) 100%)}
.epg-cols{display:grid;grid-template-columns:185px 340px;height:calc(100vh - 115px)}
.ecol{border-right:1px solid rgba(255,255,255,.08);padding:14px;overflow-y:auto}
.catbtn{width:100%;text-align:left;background:0;border:0;color:var(--muted);padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:3px}
.catbtn.act{background:rgba(0,168,232,.2);color:#fff;font-weight:700}
.chcard{width:100%;display:flex;align-items:center;gap:10px;background:rgba(20,25,38,.75);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:9px 11px;margin-bottom:7px;color:#fff;text-align:left;cursor:pointer}
.chcard.act{border-color:var(--accent);background:rgba(0,168,232,.22)}
.chlogo{width:38px;height:38px;border-radius:7px;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--accent);font-size:11px;flex-shrink:0;overflow:hidden}
.epg-bottom{height:115px;background:rgba(10,13,20,.94);border-top:1px solid rgba(255,255,255,.1);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.progbar{height:4px;background:#262f42;border-radius:2px;margin-top:8px;width:320px;overflow:hidden}.progfill{height:100%;background:var(--accent);width:62%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;margin-top:14px}
#modal{position:fixed;inset:0;background:rgba(6,8,12,.9);backdrop-filter:blur(10px);z-index:400;display:none;align-items:center;justify-content:center;padding:24px}
.mcard{background:#121622;border:1px solid rgba(255,255,255,.1);border-radius:16px;width:820px;max-width:100%;max-height:90vh;overflow-y:auto;display:grid;grid-template-columns:250px 1fr}
.epbtn{background:#192030;border:1px solid rgba(255,255,255,.08);color:#fff;padding:10px 14px;border-radius:8px;text-align:left;cursor:pointer;margin-bottom:8px;width:100%;display:flex;justify-content:space-between}
#player{position:fixed;inset:0;background:#000;z-index:700;display:none}
#vid{width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;padding:20px 32px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <div class="brand">STREAM<span>ROOM</span></div>
  <p style="color:var(--muted);font-size:13px;margin-bottom:18px">Apollo Group TV Edition • 5 Device Connections</p>
  <div id="err" style="color:#fb7185;font-size:13px;margin-bottom:8px"></div>
  <input id="u_url" placeholder="Xtream Portal URL (http://...)">
  <input id="u_usr" placeholder="Username">
  <input id="u_pwd" type="password" placeholder="Password">
  <button class="btn" id="btn-conn">Sign In to Portal</button>
  <button class="btn btn-glass" id="btn-demo">Launch Demo Mode (5 Devices)</button>
</div></div>

<div id="shell">
  <aside class="rail" id="rail" onmouseenter="this.classList.add('open')" onmouseleave="this.classList.remove('open')">
    <div>
      <div style="padding:10px 8px;font-weight:900;font-size:18px;color:var(--accent);margin-bottom:12px">SR</div>
      <button class="rbtn" onclick="tab('search',this)"><span>⌕</span><span class="rlbl">Search</span></button>
      <button class="rbtn act" onclick="tab('home',this)"><span>⌂</span><span class="rlbl">Home</span></button>
      <button class="rbtn" onclick="tab('live',this)"><span>📺</span><span class="rlbl">Live TV</span></button>
      <button class="rbtn" onclick="tab('movies',this)"><span>🎬</span><span class="rlbl">Movies</span></button>
      <button class="rbtn" onclick="tab('series',this)"><span>🎞</span><span class="rlbl">TV Shows</span></button>
      <button class="rbtn" onclick="tab('mylist',this)"><span>★</span><span class="rlbl">My List</span></button>
      <button class="rbtn" onclick="tab('settings',this)"><span>⚙</span><span class="rlbl">Settings</span></button>
    </div>
    <div style="padding:8px;font-size:11px;color:var(--accent);font-weight:800">1/5 DEV</div>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<div id="modal"><div class="mcard" id="mbody"></div></div>
<div id="player">
  <video id="vid" controls autoplay playsinline></video>
  <div class="hud"><div><span style="color:var(--accent);font-size:11px;font-weight:800">NOW PLAYING</span><h3 id="ptitle"></h3></div><button class="btn" style="width:auto;padding:9px 20px" onclick="stop()">✕ Exit Player</button></div>
</div>
<script>
var cat = { live: [], movies: [], series: [] };
var favList = [];
var cur = 'home';
var sCat = 'All';
var sCh = null;
var xt = { b: '', u: '', p: '' };

function firstItem(arr) { return (arr && arr.length > 0) ? arr.slice(0, 1).pop() : null; }
function cleanText(str) { return String(str || '').split("'").join('').split('"').join('').split('<').join('').split('>').join(''); }
function nowTime() { var d = new Date(); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

document.getElementById('btn-demo').onclick = function() {
  var u = 'https://mux.dev';
  var bg1 = 'https://unsplash.com';
  var p1 = 'https://unsplash.com';
  var p2 = 'https://unsplash.com';
  var p3 = 'https://unsplash.com';
  cat = {
    live: [
      { id: 'l1', type: 'live', num: 101, title: 'ESPN HD', cat: 'Sports', show: 'SportsCenter Live', next: 'NBA Countdown', img: '', url: u },
      { id: 'l2', type: 'live', num: 102, title: 'HBO East', cat: 'Entertainment', show: 'Cyber Horizon (Premiere)', next: 'Late Night Cinema', img: '', url: u },
      { id: 'l3', type: 'live', num: 103, title: 'CNN Live', cat: 'News', show: 'World News Tonight', next: 'Global Markets', img: '', url: u },
      { id: 'l4', type: 'live', num: 104, title: 'UFC PPV 1', cat: 'Sports', show: 'Main Card Fight Night', next: 'Post-Fight Show', img: '', url: u }
    ],
    movies: [
      { id: 'm1', type: 'movie', title: 'Cyber Horizon', year: '2026', rating: '8.7', genre: 'Sci-Fi • Action', desc: 'A rogue systems architect uncovers a global grid signal capable of rewriting memory networks.', img: p1, bg: bg1, url: u },
      { id: 'm2', type: 'movie', title: 'Apex Velocity', year: '2025', rating: '8.2', genre: 'Thriller • Crime', desc: 'High-stakes underground street racing across state lines turns into a federal manhunt.', img: p2, bg: bg1, url: u },
      { id: 'm3', type: 'movie', title: 'Shadow Protocol', year: '2026', rating: '8.5', genre: 'Action • Mystery', desc: 'An ex-intelligence operative races to stop an orbital satellite blackout.', img: p3, bg: bg1, url: u }
    ],
    series: [
      { id: 's1', type: 'series', title: 'The Syndicate', year: '2026', rating: '9.1', genre: 'Drama • Crime', desc: 'Inside a billion-dollar international tech cartel operating beyond sovereign borders.', img: p3, bg: bg1, url: u, eps: [{ num: 'S1 E1', name: 'Zero Day', url: u }, { num: 'S1 E2', name: 'Dark Fiber', url: u }, { num: 'S1 E3', name: 'Ghost Node', url: u }] },
      { id: 's2', type: 'series', title: 'Neon Frontier', year: '2025', rating: '8.8', genre: 'Sci-Fi • Drama', desc: 'Colony marshals defend the outer asteroid belt from corporate mercenaries.', img: p1, bg: bg1, url: u, eps: [{ num: 'S1 E1', name: 'Orbit One', url: u }, { num: 'S1 E2', name: 'Belt Law', url: u }] }
    ]
  };
  start();
};

document.getElementById('btn-conn').onclick = function() {
  var b = document.getElementById('u_url').value.trim().replace(/\/$/, '');
  var u = document.getElementById('u_usr').value.trim();
  var p = document.getElementById('u_pwd').value.trim();
  var e = document.getElementById('err');
  if (!b || !u || !p) { e.textContent = 'Enter Xtream Portal details or click Demo Mode'; return; }
  xt = { b: b, u: u, p: p };
  e.textContent = 'Authenticating with ' + b + '...';
  var api = b + '/player_api.php?username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p);
  fetch(api).then(function(r) { return r.json(); }).then(function(a) {
    if (!a || !a.user_info || a.user_info.auth !== 1) throw new Error('Invalid portal credentials');
    e.textContent = 'Syncing Live TV channels...';
    return fetch(api + '&action=get_live_streams').then(function(r) { return r.json(); }).then(function(lv) {
      cat.live = (lv || []).slice(0, 180).map(function(c, i) {
        return { id: 'l' + c.stream_id, type: 'live', num: c.num || (100 + i), title: c.name || 'Channel', cat: String(c.category_id || 'Live'), show: 'Live Broadcast', next: 'Up Next', img: c.stream_icon || '', url: b + '/live/' + u + '/' + p + '/' + c.stream_id + '.m3u8' };
      });
      e.textContent = 'Syncing VOD Movies...';
      return fetch(api + '&action=get_vod_streams');
    }).then(function(r) { return r.json(); }).then(function(vd) {
      cat.movies = (vd || []).slice(0, 120).map(function(m) {
        return { id: 'm' + m.stream_id, type: 'movie', title: m.name || 'Movie', year: 'HD', rating: String(m.rating || '8.0'), genre: 'VOD Movie', desc: 'Stream in Full HD from your Apollo Portal.', img: m.stream_icon || '', bg: m.stream_icon || '', url: b + '/movie/' + u + '/' + p + '/' + m.stream_id + '.' + (m.container_extension || 'mp4') };
      });
      e.textContent = 'Syncing TV Shows...';
      return fetch(api + '&action=get_series');
    }).then(function(r) { return r.json(); }).then(function(sr) {
      cat.series = (sr || []).slice(0, 120).map(function(s) {
        return { id: 's' + s.series_id, sid: s.series_id, type: 'series', title: s.name || 'Series', year: 'Series', rating: String(s.rating || '8.5'), genre: s.genre || 'TV Series', desc: s.plot || 'Stream full seasons on demand.', img: s.cover || '', bg: s.cover || '', url: '', eps: [] };
      });
      start();
    });
  }).catch(function(err) { e.textContent = 'Error: ' + (err && err.message ? err.message : 'Connection failed'); });
};

function start() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  sCh = firstItem(cat.live);
  draw();
}

function tab(t, b) {
  cur = t;
  var btns = document.querySelectorAll('.rbtn');
  for (var i = 0; i < btns.length; i++) btns.item(i).classList.remove('act');
  if (b) b.classList.add('act');
  document.getElementById('rail').classList.remove('open');
  draw();
}

function toggleFav(id) {
  if (favList.indexOf(id) >= 0) favList = favList.filter(function(x) { return x !== id; });
  else favList.push(id);
  draw();
}

function openDetail(type, id) {
  var pool = type === 'movie' ? cat.movies : (type === 'series' ? cat.series : cat.live);
  var item = firstItem(pool.filter(function(x) { return x.id === id; }));
  if (!item) return;
  if (item.type === 'live') { play(cleanText(item.title), item.url); return; }
  var saved = favList.indexOf(item.id) >= 0;
  var t = cleanText(item.title);
  var epHtml = '';
  if (item.type === 'series' && item.eps && item.eps.length) {
    epHtml = '<div style="margin-top:16px"><div style="font-size:12px;color:var(--accent);font-weight:800;margin-bottom:8px">EPISODES</div>' +
      item.eps.map(function(ep) {
        return '<button class="epbtn" onclick="closeModal();play(\'' + t + ' - ' + cleanText(ep.num) + '\',\'' + ep.url + '\')"><span><strong>' + cleanText(ep.num) + '</strong> • ' + cleanText(ep.name) + '</span><span style="color:var(--accent)">▶ Play</span></button>';
      }).join('') + '</div>';
  }
  document.getElementById('mbody').innerHTML =
    '<div>' + (item.img ? '<img src="' + item.img + '" style="width:100%;height:100%;object-fit:cover">' : '<div style="height:340px;display:flex;align-items:center;justify-content:center;background:#182032;color:var(--accent);font-weight:900;padding:16px;text-align:center">' + t + '</div>') + '</div>' +
    '<div style="padding:26px;display:flex;flex-direction:column;justify-content:space-between">' +
    '<div><div style="display:flex;justify-content:space-between;align-items:start"><h2 style="font-size:25px">' + t + '</h2><button class="btn btn-glass" style="width:auto;padding:6px 12px;margin:0" onclick="closeModal()">✕</button></div>' +
    '<div class="meta"><span class="imdb">IMDb ' + cleanText(item.rating || '8.4') + '</span><span>' + cleanText(item.year || '2026') + '</span><span class="hd">1080p HD</span><span>' + cleanText(item.genre || '') + '</span></div>' +
    '<p style="color:#cbd5e1;font-size:14px;line-height:1.5;margin-top:8px">' + cleanText(item.desc || '') + '</p>' + epHtml + '</div>' +
    '<div style="display:flex;gap:12px;margin-top:18px">' + (item.url ? '<button class="btn" style="width:auto;padding:11px 24px" onclick="closeModal();play(\'' + t + '\',\'' + item.url + '\')">▶ Watch Now</button>' : '') +
    '<button class="btn btn-glass" style="width:auto;padding:11px 20px" onclick="toggleFav(\'' + item.id + '\');openDetail(\'' + item.type + '\',\'' + item.id + '\')">' + (saved ? '✓ In My List' : '+ My List') + '</button></div></div>';
  document.getElementById('modal').style.display = 'flex';
  if (item.type === 'series' && item.sid && (!item.eps || !item.eps.length) && xt.b) {
    fetch(xt.b + '/player_api.php?username=' + encodeURIComponent(xt.u) + '&password=' + encodeURIComponent(xt.p) + '&action=get_series_info&series_id=' + item.sid)
      .then(function(r) { return r.json(); }).then(function(info) {
        var epObj = info && info.episodes ? info.episodes : {};
        var keys = Object.keys(epObj);
        var list = [];
        keys.forEach(function(k) { (epObj[k] || []).forEach(function(ep) { list.push({ num: 'S' + k + ' E' + ep.episode_num, name: ep.title || 'Episode', url: xt.b + '/series/' + xt.u + '/' + xt.p + '/' + ep.id + '.' + (ep.container_extension || 'mp4') }); }); });
        item.eps = list.slice(0, 30);
        openDetail('series', item.id);
      }).catch(function(){});
  }
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function play(t, u) {
  if (!u) return;
  document.getElementById('ptitle').textContent = t;
  document.getElementById('player').style.display = 'block';
  var v = document.getElementById('vid');
  v.src = u;
  v.play().catch(function(){});
}

function stop() {
  document.getElementById('player').style.display = 'none';
  var v = document.getElementById('vid');
  v.pause();
  v.removeAttribute('src');
}

function posterRow(title, arr) {
  if (!arr || !arr.length) return '';
  return '<div class="section"><div class="stitle">' + title + '</div><div class="row">' +
    arr.map(function(i) {
      var st = cleanText(i.title || 'Stream');
      var media = i.img ? '<img class="pimg" src="' + i.img + '">' : '<div class="pimg" style="display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;color:var(--accent)">' + st + '</div>';
      return '<button class="poster" onclick="openDetail(\'' + i.type + '\',\'' + i.id + '\')">' +
        (i.rating ? '<span class="pbadge">★ ' + cleanText(i.rating) + '</span>' : '') + media +
        '<div class="ptitle">' + st + '</div></button>';
    }).join('') + '</div></div>';
}

function topBar() {
  return '<div class="topbar"><div class="pills">' +
    '<button class="pill ' + (cur === 'home' ? 'act' : '') + '" onclick="tab(\'home\',null)">Featured</button>' +
    '<button class="pill ' + (cur === 'live' ? 'act' : '') + '" onclick="tab(\'live\',null)">Live Channels</button>' +
    '<button class="pill ' + (cur === 'movies' ? 'act' : '') + '" onclick="tab(\'movies\',null)">Trending Movies</button>' +
    '<button class="pill ' + (cur === 'series' ? 'act' : '') + '" onclick="tab(\'series\',null)">Popular Shows</button>' +
    '</div><div style="font-size:13px;font-weight:700;color:#cbd5e1">' + nowTime() + ' • <span style="color:var(--accent)">APOLLO HD</span></div></div>';
}

function draw() {
  var stg = document.getElementById('stage');
  if (cur === 'home') {
    var h = firstItem(cat.movies) || firstItem(cat.live);
    var ht = h ? cleanText(h.title) : '';
    var saved = h && favList.indexOf(h.id) >= 0;
    var bgStyle = (h && h.bg) ? 'background-image:url(\'' + h.bg + '\')' : 'background:linear-gradient(135deg,#10253f,#090b10)';
    stg.innerHTML = topBar() +
      (h ? '<div class="hero" style="' + bgStyle + '"><div class="hcontent"><span style="color:var(--accent);font-weight:900;font-size:12px;letter-spacing:1.5px">APOLLO SPOTLIGHT</span><h1 style="font-size:42px;margin:4px 0">' + ht + '</h1><div class="meta"><span class="imdb">IMDb ' + cleanText(h.rating || '8.7') + '</span><span>' + cleanText(h.year || '2026') + '</span><span class="hd">4K UHD</span><span>' + cleanText(h.genre || 'Featured') + '</span></div><p style="color:#cbd5e1;font-size:14px;line-height:1.5;margin-bottom:18px">' + cleanText(h.desc || '') + '</p><div style="display:flex;gap:12px"><button class="btn" style="width:auto;padding:12px 26px" onclick="play(\'' + ht + '\',\'' + h.url + '\')">▶ Play Now</button><button class="btn btn-glass" style="width:auto;padding:12px 22px" onclick="openDetail(\'' + h.type + '\',\'' + h.id + '\')">ⓘ Details</button><button class="btn btn-glass" style="width:auto;padding:12px 20px" onclick="toggleFav(\'' + h.id + '\')">' + (saved ? '✓ Saved' : '+ My List') + '</button></div></div></div>' : '') +
      posterRow('Live TV Channels', cat.live) + posterRow('Trending Movies', cat.movies) + posterRow('Popular TV Shows', cat.series);
  } else if (cur === 'live') {
    var cats = ['All'];
    cat.live.forEach(function(c) { if (cats.indexOf(c.cat) < 0) cats.push(c.cat); });
    var ls = sCat === 'All' ? cat.live : cat.live.filter(function(c) { return c.cat === sCat; });
    stg.innerHTML = '<div class="live-wrap"><video id="pvid" muted autoplay playsinline></video><div class="epg-overlay"><div class="epg-cols"><div class="ecol"><h3 style="color:var(--accent);font-size:13px;margin-bottom:10px">CATEGORIES</h3>' +
      cats.map(function(c) { var sc = cleanText(c); return '<button class="catbtn ' + (sCat === c ? 'act' : '') + '" onclick="sCat=\'' + sc + '\';draw()">' + sc + '</button>'; }).join('') +
      '</div><div class="ecol"><h3 style="color:var(--accent);font-size:13px;margin-bottom:10px">CHANNELS (' + ls.length + ')</h3>' +
      ls.map(function(c) {
        var ct = cleanText(c.title);
        return '<button class="chcard ' + (sCh && sCh.id === c.id ? 'act' : '') + '" onclick="selCh(\'' + c.id + '\')" ondblclick="play(\'' + ct + '\',\'' + c.url + '\')">' +
          '<div class="chlogo">' + (c.img ? '<img src="' + c.img + '" style="width:100%;height:100%;object-fit:contain">' : c.num) + '</div>' +
          '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">' + ct + '</div><div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + cleanText(c.show || 'Live') + '</div></div></button>';
      }).join('') +
      '</div></div>' +
      (sCh ? '<div class="epg-bottom"><div><span style="color:var(--accent);font-size:11px;font-weight:800">NOW PLAYING • CH ' + sCh.num + '</span><h2 style="font-size:22px;margin:2px 0">' + cleanText(sCh.title) + ' — ' + cleanText(sCh.show || 'Live') + '</h2><div style="font-size:12px;color:var(--muted)">UP NEXT: ' + cleanText(sCh.next || 'Upcoming Program') + '</div><div class="progbar"><div class="progfill"></div></div></div><button class="btn" style="width:auto;padding:12px 26px" onclick="play(\'' + cleanText(sCh.title) + '\',\'' + sCh.url + '\')">⛶ Full Screen</button></div>' : '') +
      '</div></div>';
    if (sCh) setTimeout(function() { var pv = document.getElementById('pvid'); if (pv) { pv.src = sCh.url; pv.play().catch(function(){}); } }, 50);
  } else if (cur === 'movies' || cur === 'series') {
    var items = cur === 'movies' ? cat.movies : cat.series;
    stg.innerHTML = topBar() + '<div class="section"><h2>' + (cur === 'movies' ? 'Movies' : 'TV Shows') + '</h2><div class="grid">' +
      items.map(function(i) {
        var t = cleanText(i.title);
        var media = i.img ? '<img class="pimg" src="' + i.img + '">' : '<div class="pimg" style="display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;color:var(--accent)">' + t + '</div>';
        return '<button class="poster" onclick="openDetail(\'' + i.type + '\',\'' + i.id + '\')"><span class="pbadge">★ ' + cleanText(i.rating || '8.4') + '</span>' + media + '<div class="ptitle">' + t + '</div></button>';
      }).join('') + '</div></div>';
  } else if (cur === 'mylist') {
    var savedItems = cat.live.concat(cat.movies, cat.series).filter(function(x) { return favList.indexOf(x.id) >= 0; });
    stg.innerHTML = topBar() + '<div class="section"><h2>My List (' + savedItems.length + ')</h2><div class="grid">' +
      savedItems.map(function(i) {
        var t = cleanText(i.title);
        var media = i.img ? '<img class="pimg" src="' + i.img + '">' : '<div class="pimg" style="display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;color:var(--accent)">' + t + '</div>';
        return '<button class="poster" onclick="openDetail(\'' + i.type + '\',\'' + i.id + '\')">' + media + '<div class="ptitle">' + t + '</div></button>';
      }).join('') + '</div></div>';
  } else if (cur === 'search') {
    stg.innerHTML = topBar() + '<div class="section"><h2>Search Apollo Catalog</h2><input style="max-width:440px;margin-top:12px" placeholder="Search channels, movies, TV shows..." oninput="srch(this.value)"><div class="grid" id="sres"></div></div>';
  } else {
    stg.innerHTML = topBar() + '<div class="section"><h2>Account & Devices</h2><div class="lbox" style="margin-top:16px"><h3>Active Connections: 1 / 5</h3><p style="color:var(--muted);font-size:13px;margin:8px 0 18px">Your portal supports up to 5 simultaneous streams across Fire TV, Android TV, and Tablets.</p><button class="btn" onclick="location.reload()">Switch Xtream Portal</button></div></div>';
  }
}

function selCh(id) { sCh = firstItem(cat.live.filter(function(x) { return x.id === id; })); draw(); }

function srch(q) {
  var all = cat.live.concat(cat.movies, cat.series).filter(function(x) { return (x.title || '').toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  document.getElementById('sres').innerHTML = all.map(function(i) {
    var t = cleanText(i.title);
    var media = i.img ? '<img class="pimg" src="' + i.img + '">' : '<div class="pimg" style="display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;color:var(--accent)">' + t + '</div>';
    return '<button class="poster" onclick="openDetail(\'' + i.type + '\',\'' + i.id + '\')">' + media + '<div class="ptitle">' + t + '</div></button>';
  }).join('');
}

window.handleFireTvBack = function() {
  if (document.getElementById('player').style.display === 'block') { stop(); return true; }
  if (document.getElementById('modal').style.display === 'flex') { closeModal(); return true; }
  var r = document.getElementById('rail');
  if (!r.classList.contains('open')) { r.classList.add('open'); return true; }
  return false;
};
</script>
</body>
</html>
