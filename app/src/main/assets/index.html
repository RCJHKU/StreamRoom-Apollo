<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Room</title>
<script src="https://jsdelivr.net"></script>
<style>
:root{--bg:#090c12;--panel:#111622;--card:#182032;--accent:#00b4d8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:sans-serif;overflow:hidden;user-select:none}
button:focus,input:focus{outline:3px solid var(--accent);box-shadow:0 0 15px rgba(0,180,216,.5);transform:scale(1.03)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#13233c,#090c12);z-index:500}
.box{background:var(--panel);padding:32px;border-radius:14px;width:420px;border:1px solid #1e293b}
.logo{font-size:26px;font-weight:900;margin-bottom:6px}.logo span{color:var(--accent)}
input{width:100%;padding:12px;margin-bottom:10px;background:var(--bg);border:1px solid #334155;border-radius:8px;color:#fff}
.btn{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:800;cursor:pointer;margin-top:4px}
.btn2{background:rgba(255,255,255,.15);color:#fff}
#shell{display:none;height:100vh;width:100vw}
.sb{width:74px;background:#0b0f19;border-right:1px solid #1e293b;display:flex;flex-direction:column;justify-content:space-between;padding:18px 8px;transition:.2s}
.sb.open{width:210px}
.nb{display:flex;align-items:center;gap:14px;background:0;border:0;color:var(--muted);padding:12px;border-radius:8px;font-size:15px;cursor:pointer;width:100%;text-align:left;margin-bottom:4px}
.nb.act{background:var(--card);color:#fff;font-weight:700}
.lbl{display:none}.sb.open .lbl{display:inline}
.main{flex:1;height:100vh;overflow-y:auto}
.hero{height:52vh;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end}
.grad{position:absolute;inset:0;background:linear-gradient(90deg,#090c12 25%,rgba(9,12,18,.4) 75%,transparent),linear-gradient(0deg,#090c12 5%,transparent 55%);padding:32px 40px;display:flex;flex-direction:column;justify-content:flex-end}
.row{padding:14px 40px}.track{display:flex;gap:12px;overflow-x:auto;padding:6px 0}
.card{flex:0 0 165px;background:var(--card);border:0;border-radius:8px;overflow:hidden;color:#fff;text-align:left;cursor:pointer}
.card img{width:100%;height:215px;object-fit:cover;display:block;background:#0f172a}
.card.live img{height:100px;object-fit:contain;padding:12px}
.epg{display:grid;grid-template-columns:200px 320px 1fr;height:100vh}
.col{border-right:1px solid #1e293b;padding:14px;overflow-y:auto}
.cbtn{width:100%;text-align:left;background:0;border:0;color:var(--muted);padding:10px;border-radius:6px;cursor:pointer}
.cbtn.act,.chbtn.act{background:var(--card);color:#fff;font-weight:700;border-color:var(--accent)}
.chbtn{width:100%;display:flex;gap:10px;background:var(--panel);border:1px solid #1e293b;border-radius:8px;padding:10px;margin-bottom:6px;color:#fff;text-align:left;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-top:14px}
#player{position:fixed;inset:0;background:#000;z-index:300;display:none}
#vid{width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;padding:18px 28px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="login"><div class="box">
  <div class="logo">STREAM<span>ROOM</span></div>
  <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Apollo IPTV & VOD Portal</p>
  <div id="err" style="color:#fb7185;font-size:13px;margin-bottom:8px"></div>
  <input id="u_url" placeholder="Xtream Server URL (http://...)">
  <input id="u_usr" placeholder="Username">
  <input id="u_pwd" type="password" placeholder="Password">
  <button class="btn" onclick="conn()">Connect Xtream</button>
  <button class="btn btn2" onclick="demo()">Launch Demo Mode (5 Devices)</button>
</div></div>
<div id="shell">
  <aside class="sb" id="sb" onmouseenter="this.classList.add('open')" onmouseleave="this.classList.remove('open')">
    <div>
      <div style="padding:8px;font-weight:900;color:var(--accent);margin-bottom:12px">SR</div>
      <button class="nb act" onclick="tab('home',this)"><span>⌂</span><span class="lbl">Home</span></button>
      <button class="nb" onclick="tab('live',this)"><span>📺</span><span class="lbl">Live TV</span></button>
      <button class="nb" onclick="tab('movies',this)"><span>🎬</span><span class="lbl">Movies</span></button>
      <button class="nb" onclick="tab('series',this)"><span>🎞</span><span class="lbl">TV Shows</span></button>
      <button class="nb" onclick="tab('mylist',this)"><span>★</span><span class="lbl">My List</span></button>
      <button class="nb" onclick="tab('search',this)"><span>⌕</span><span class="lbl">Search</span></button>
      <button class="nb" onclick="tab('settings',this)"><span>⚙</span><span class="lbl">Settings</span></button>
    </div>
    <div style="padding:8px;font-size:11px;color:var(--accent);font-weight:700">1/5 DEV</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="player"><video id="vid" controls autoplay playsinline></video>
  <div class="hud"><h3 id="ptitle"></h3><button class="btn" style="width:auto;padding:8px 18px" onclick="stop()">✕ Exit</button></div>
</div>

function playUrl(v,u){if(hls){hls.destroy();hls=null}if(u.includes('.m3u8')&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)}else{v.src=u}v.play().catch(()=>{})}
async function conn(){
  const b=document.getElementById('u_url').value.trim().replace(/\/$/,''),u=document.getElementById('u_usr').value.trim(),p=document.getElementById('u_pwd').value.trim(),e=document.getElementById('err');
  if(!b||!u||!p){e.textContent='Enter Xtream details or tap Demo Mode';return}
  e.textContent='Loading portal...';
  try{
    const a=await fetch(`${b}/player_api.php?username=${u}&password=${p}`).then(r=>r.json());
    if(!a.user_info||a.user_info.auth!==1)throw 1;
    const[lv,vd,sr]=await Promise.all([
      fetch(`${b}/player_api.php?username=${u}&password=${p}&action=get_live_streams`).then(r=>r.json()),
      fetch(`${b}/player_api.php?username=${u}&password=${p}&action=get_vod_streams`).then(r=>r.json()),
      fetch(`${b}/player_api.php?username=${u}&password=${p}&action=get_series`).then(r=>r.json())
    ]);
    cat.live=(lv||[]).slice(0,150).map((c,i)=>({id:'l'+c.stream_id,type:'live',num:c.num||100+i,title:c.name,cat:c.category_id||'Live',img:c.stream_icon||'',url:`${b}/live/${u}/${p}/${c.stream_id}.m3u8`}));
    cat.movies=(vd||[]).slice(0,100).map(m=>({id:'m'+m.stream_id,type:'movie',title:m.name,img:m.stream_icon||'',desc:'HD Movie',url:`${b}/movie/${u}/${p}/${m.stream_id}.${m.container_extension||'mp4'}`}));
    cat.series=(sr||[]).slice(0,100).map(s=>({id:'s'+s.series_id,type:'series',title:s.name,img:s.cover||'',desc:s.plot||'Series',url:''}));
    start();
  }catch{e.textContent='Failed to connect. Check URL or use Demo Mode.'}
}

  const u='https://mux.dev';
  cat={
    live:[{id:'l1',type:'live',num:101,title:'ESPN HD',cat:'Sports',img:'https://wikimedia.org},{id:'l2',type:'live',num:102,title:'HBO East',cat:'Movies',img:'https://wikimedia.org}],
    movies:[{id:'m1',type:'movie',title:'Cyber Horizon',img:'https://unsplash.com systems architect uncovers a global grid signal.',url:u}],
    series:[{id:'s1',type:'series',title:'The Syndicate',img:'https://unsplash.com an international tech cartel.',url:u}]
  };start();
}
function start(){document.getElementById('login').style.display='none';document.getElementById('shell').style.display='flex';sCh=cat.live[0]||null;draw()}
function tab(t,b){cur=t;document.querySelectorAll('.nb').forEach(x=>x.classList.remove('act'));if(b)b.classList.add('act');document.getElementById('sb').classList.remove('open');draw()}
function fav(id){list=list.includes(id)?list.filter(x=>x!==id):[...list,id];localStorage.setItem('sr_list',JSON.stringify(list));draw()}
function play(t,u){if(!u)return;document.getElementById('ptitle').textContent=t;document.getElementById('player').style.display='block';playUrl(document.getElementById('vid'),u)}
function stop(){document.getElementById('player').style.display='none';const v=document.getElementById('vid');v.pause();if(hls){hls.destroy();hls=null}}
