<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream Room</title>
<style>
:root{--bg:#090c12;--panel:#111622;--card:#182032;--accent:#00b4d8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:sans-serif;overflow:hidden}
button:focus,input:focus{outline:3px solid var(--accent)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090c12;z-index:500}
.box{background:var(--panel);padding:28px;border-radius:12px;width:400px;border:1px solid #1e293b}
input{width:100%;padding:11px;margin-bottom:9px;background:var(--bg);border:1px solid #334155;border-radius:7px;color:#fff}
.btn{width:100%;padding:12px;background:var(--accent);color:#000;border:0;border-radius:7px;font-weight:800;cursor:pointer;margin-top:6px}
.btn2{background:rgba(255,255,255,.15);color:#fff}
#shell{display:none;height:100vh}.sb{width:180px;background:#0b0f19;border-right:1px solid #1e293b;padding:16px 8px}
.nb{display:block;width:100%;text-align:left;background:0;border:0;color:var(--muted);padding:11px;border-radius:6px;cursor:pointer;margin-bottom:4px}
.nb.act{background:var(--card);color:#fff;font-weight:700}.main{flex:1;overflow-y:auto;padding:24px}
.track{display:flex;gap:12px;overflow-x:auto;padding:8px 0 18px}.card{flex:0 0 160px;background:var(--card);border:0;border-radius:8px;padding:14px;color:#fff;text-align:left;cursor:pointer}
#player{position:fixed;inset:0;background:#000;z-index:300;display:none}#vid{width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;padding:16px;background:rgba(0,0,0,.75);display:flex;justify-content:space-between}
</style></head><body>
<div id="login"><div class="box">
  <h2 style="margin-bottom:4px">STREAM<span style="color:var(--accent)">ROOM</span></h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Apollo IPTV & VOD Portal (5 Devices)</p>
  <div id="err" style="color:#fb7185;font-size:13px;margin-bottom:8px"></div>
  <input id="u_url" placeholder="Xtream Server URL (http://...)">
  <input id="u_usr" placeholder="Username">
  <input id="u_pwd" type="password" placeholder="Password">
  <button class="btn" onclick="conn()">Connect Xtream</button>
  <button class="btn btn2" onclick="demo()">Launch Demo Mode (5 Devices)</button>
</div></div>
<div id="shell">
  <aside class="sb"><h3 style="color:var(--accent);padding:8px;margin-bottom:10px">STREAM ROOM</h3>
    <button class="nb act" onclick="tab('home',this)">Home</button>
    <button class="nb" onclick="tab('live',this)">Live TV</button>
    <button class="nb" onclick="tab('movies',this)">Movies</button>
    <button class="nb" onclick="tab('series',this)">TV Shows</button>
    <button class="nb" onclick="location.reload()">Switch Portal</button>
  </aside><main class="main" id="main"></main>
</div>
<div id="player"><video id="vid" controls autoplay playsinline></video><div class="hud"><h3 id="pt"></h3><button class="btn" style="width:auto;padding:6px 14px" onclick="stop()">Exit</button></div></div>
<script>
var cat={live:[],movies:[],series:[]},cur='home';
function clean(s){return String(s||'').replace(/['"\\<>]/g,'')}
function demo(){var u='https://mux.dev{live:[{title:'ESPN HD',url:u},{title:'HBO East',url:u},{title:'CNN Live',url:u}],movies:[{title:'Cyber Horizon',url:u},{title:'Apex Velocity',url:u}],series:[{title:'The Syndicate',url:u}]};start()}
function conn(){var b=document.getElementById('u_url').value.trim().replace(/\/$/,''),u=document.getElementById('u_usr').value.trim(),p=document.getElementById('u_pwd').value.trim(),e=document.getElementById('err');if(!b||!u||!p){e.textContent='Enter Xtream details';return}e.textContent='Connecting...';var a=b+'/player_api.php?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p);fetch(a).then(function(r){return r.json()}).then(function(d){if(!d||!d.user_info||d.user_info.auth!==1)throw new Error('Invalid login');return Promise.all([fetch(a+'&action=get_live_streams').then(function(r){return r.json()}),fetch(a+'&action=get_vod_streams').then(function(r){return r.json()}),fetch(a+'&action=get_series').then(function(r){return r.json()})])}).then(function(x){cat.live=(x.slice(0,1).pop()||[]).slice(0,150).map(function(c){return{title:c.name,url:b+'/live/'+u+'/'+p+'/'+c.stream_id+'.m3u8'}});cat.movies=(x.slice(1,2).pop()||[]).slice(0,100).map(function(m){return{title:m.name,url:b+'/movie/'+u+'/'+p+'/'+m.stream_id+'.'+(m.container_extension||'mp4')}});cat.series=(x.slice(2,3).pop()||[]).slice(0,100).map(function(s){return{title:s.name,url:''}});start()}).catch(function(err){e.textContent='Error: '+(err.message||'Failed')})}
function start(){document.getElementById('login').style.display='none';document.getElementById('shell').style.display='flex';draw()}
function tab(t,b){cur=t;document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('act')});b.classList.add('act');draw()}
function play(t,u){if(!u)return;document.getElementById('pt').textContent=t;document.getElementById('player').style.display='block';var v=document.getElementById('vid');v.src=u;v.play().catch(function(){})}
function stop(){document.getElementById('player').style.display='none';var v=document.getElementById('vid');v.pause();v.removeAttribute('src')}
function row(t,a){return a.length?'<h3>'+t+'</h3><div class="track">'+a.map(function(i){var st=clean(i.title);return'<button class="card" onclick="play(\''+st+'\',\''+i.url+'\')"><div style="color:var(--accent);font-weight:800;margin-bottom:6px">STREAM</div><div>'+st+'</div></button>'}).join('')+'</div>':''}
function draw(){var m=document.getElementById('main');m.innerHTML=cur==='home'?row('Live TV',cat.live)+row('Movies',cat.movies)+row('TV Shows',cat.series):row(cur.toUpperCase(),cat[cur]||[])}
window.handleFireTvBack=function(){if(document.getElementById('player').style.display==='block'){stop();return true}return false};
</script></body></html>
